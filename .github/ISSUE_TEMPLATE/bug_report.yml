name: Bug report
description: Report reproducible incorrect behavior in AIX
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, personal paths, logs containing request data, and conversation contents. Report security issues privately instead.
  - type: input
    id: version
    attributes:
      label: AIX version
      placeholder: Output of aix --version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows or unsupported platform
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant sanitized status or doctor output. Never paste API keys or session contents.
